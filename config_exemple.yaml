# ==============================================================================
# CONFIGURAÇÃO DO GERADOR DE RELATÓRIOS FOTOGRÁFICOS (CESIN / BANCO DO BRASIL)
# ==============================================================================

# Configurações de exibição e posicionamento das imagens no Excel
layout_settings:
  default_min_row_height: 23.25 # Altura mínima da linha (em pontos) para evitar quebras de layout
  fixed_width_px: 390           # Largura fixa da imagem em pixels (usado quando fix_width: true)
  image_span: 10                # Quantidade de linhas que cada imagem ocupará verticalmente
  photo_columns:                # Colunas de ancoragem para as fotos no template
    - B
    - D
    - F
  row_spacing: 2                # Espaçamento (linhas vazias) entre o título da seção e as fotos
  sort_method: date             # Critério de ordenação das fotos na pasta (date ou name)

# Definição dos diretórios e arquivos de trabalho
paths:
  base_images: images_organized       # Pasta raiz contendo as subpastas das seções
  template: templates/model.xlsx      # Arquivo Excel original com o layout do Banco do Brasil
  output: templates/relatorio_final.xlsx # Local onde o relatório gerado será salvo

# Dados básicos do projeto e formatação de texto
project_metadata:
  project_name: Relatório             # Nome interno do projeto
  target_sheet: Relatório fotográfico # Nome exato da aba (Worksheet) dentro do Excel
  default_font: Arial                 # Fonte padrão para possíveis inserções de texto
  default_font_size: 18               # Tamanho da fonte padrão

# ------------------------------------------------------------------------------
# DEFINIÇÃO DAS SEÇÕES DO RELATÓRIO
# Cada seção corresponde a uma subpasta em 'base_images' e um título no Excel.
# ------------------------------------------------------------------------------
sections:
  - id: entorno
    label: Entorno da obra
    max_photos: 5
    fix_width: false

  - id: geral_obra
    label: Geral da obra
    max_photos: 2
    fix_width: true

  - id: projetos_arts
    label: Projetos/ARTs
    max_photos: 4
    fix_width: false

  - id: alvara_licenca
    label: Alvará/Licenças
    max_photos: 1
    fix_width: false

  - id: geral_habitacao
    label: Geral da habitação (EXTERNAS DA TORRE)
    max_photos: 1
    fix_width: true

  # Seção especial: utiliza distribuição personalizada por pavimento
  - id: pavimentos
    label: Pavimentos (INTERNAS DA TORRE)
    max_photos: 120
    fix_width: true
    num_pavimentos: [9, 6, 8, 6, 6, 7, 6, 6, 5, 4, 4, 7, 7, 5, 3, 4, 4, 4, 5, 4, 5, 4]