[project]
name = "report-works"
version = "0.1.0"
description = "Gerador de relatórios fotográficos de obras a partir de templates Excel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "openpyxl>=3.1",
    # Motor inicial: automação do Excel via COM (somente Windows com Excel instalado).
    "xlwings>=0.33; sys_platform == 'win32'",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.33",
    "rarfile>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
    "httpx>=0.28.1",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_works"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Scripts de experimento (spikes) e a pasta local de testes manuais ficam fora do lint.
extend-exclude = ["test", "docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# Strict no código de produção; testes em modo padrão.
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false
